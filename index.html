<!doctype html>
<html lang="es" data-mode="dark" data-direction="eclipse">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b10" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <meta property="og:title" content="Summa — Todo cuenta." />
    <meta property="og:site_name" content="Summa" />
    <meta property="og:description" content="La suma de tu vida en un solo lugar: tareas, finanzas, deporte y objetivos." />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Summa" />
    <title>Summa — Todo cuenta.</title>
    <meta
      name="description"
      content="Summa: la suma de tu vida en un solo lugar. Tareas, finanzas, deporte y objetivos. Todo cuenta."
    />
    <script>
      // Apply saved theme before paint to avoid a flash.
      (function () {
        try {
          // summa: con fallback a nucleo: (migración de marca; la copia real corre en la app)
          const s = JSON.parse(localStorage.getItem('summa:settings') || localStorage.getItem('nucleo:settings') || '{}')
          const root = document.documentElement
          if (s.mode) root.setAttribute('data-mode', s.mode === 'system'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : s.mode)
          if (s.direction) root.setAttribute('data-direction', s.direction)
          if (s.accent) {
            root.style.setProperty('--accent', s.accent.hsl)
            root.style.setProperty('--accent-fg', s.accent.fg)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
